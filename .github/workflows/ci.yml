name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Verify and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      # Node is only for dependency lifecycle scripts (@opencode/cli runs
      # `node ./postinstall.mjs`). The bot and the CLI run on Bun.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma + SQL (discord-digital-twin)
        run: bun run generate
        working-directory: discord-digital-twin

      - name: Build discord-digital-twin
        run: bun run build
        working-directory: discord-digital-twin

      # bun check, oxlint, oxfmt --check, fallow, then the build.
      - name: Verify
        run: bun run verify
        env:
          NO_COLOR: '1'

      # `kimaki session diff` shells out to the critique CLI, and the test that
      # covers it asserts critique's own output.
      - name: Install critique
        run: bun add -g critique@0.4.0

      # --retry=3: some e2e tests have timing sensitivity on CI hardware
      # (question tool cleanup races, reply ordering under slower I/O).
      - name: Run tests
        run: bun run test -- --retry=3
        working-directory: kimaki
        env:
          NODE_ENV: test
          NO_COLOR: '1'
